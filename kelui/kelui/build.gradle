plugins {
    id 'com.android.library'
}

android {
    namespace 'com.example.kelui'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    // Stripping is usually default, but we can ensure it via flags if needed
                    arguments "-DANDROID_STL=c++_shared"
                }
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Task to copy stripped native libs to a distribution folder
tasks.register('copyNativeLibs', Copy) {
    dependsOn 'assembleRelease'
    from("${project.buildDir}/intermediates/stripped_native_libs/release/out/lib")
    into("${project.rootDir}/dist/libs")
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
